<html lang="en">
<head>
<meta charset="utf-8">

<title>Pond Jam — Prototype</title>
<style>

  .ov.show { display:flex; }
  .card { background:#fffdf6; color:#1d2a26; width:min(88%,360px); border-radius:22px; padding:22px 20px 18px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }

  .card p { margin:6px 0; color:#4b5a55; font-size:15px; }

    n = Math.max(1, Math.min(LEVELS.length, n)); save.level = n; persist(); tok++;
    L = LEVELS[n - 1]; sim = P.newSim(L); ended = false; hint = null; fx = [];
    vis = L.animals.map((a) => ({ x: a.cell % L.n, y: (a.cell / L.n) | 0, path: null, state: 'here', t0: 0, alpha: 1, bump: 0 }));
    $('lvl').textContent = 'Level ' + n;
    ['winOv', 'failOv'].forEach((i) => $(i).classList.remove('show'));
    const RULES = {
      1: 'Tap an animal. Clear path = it walks to the water and drinks. Blocked = it walks as far as it can and stops.',
      2: 'Predators have a red shadow. If prey and predator end up side by side, the prey panics and the level is over.',
      3: 'Sometimes a predator has to leave before a prey can safely move up. Clear the way first.',
    };
    $('rules').textContent = RULES[n] || ''; $('rules').style.display = RULES[n] ? '' : 'none';
    layout(); hud();
  }
  function hud() {
    $('drank').textContent = `💧 ${L.animals.length - sim.left}/${L.animals.length}`;
    $('spare').textContent = `${sim.taps} moves`;
  }
  function layout() {
    const r = cv.getBoundingClientRect(); DPR = Math.min(devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    if (!L) return;
    const top = 64, bot = L.id <= 3 ? 90 : 30;
    const avail = Math.min(W - 56, H - top - bot - 56);
    const cs = Math.floor(avail / L.n);
    G = { cs, ox: Math.round((W - cs * L.n) / 2), oy: Math.round(top + (H - top - bot - cs * L.n) / 2) };
  }
  addEventListener('resize', layout);
  const cellXY = (x, y) => [G.ox + (x + 0.5) * G.cs, G.oy + (y + 0.5) * G.cs];

  cv.addEventListener('pointerdown', (e) => {
    if (ended || sim.won || sim.lost) return;
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const x = Math.floor((px - G.ox) / G.cs), y = Math.floor((py - G.oy) / G.cs);
    if (x < 0 || y < 0 || x >= L.n || y >= L.n) return;
    const id = sim.pos.indexOf(y * L.n + x);
    if (id < 0) return;
    act(id);
  });
  function act(id) {
    const a = L.animals[id], v = vis[id], now = performance.now();
    const r = P.tap(sim, id);
    hint = null;
    if (!r) return;
    if (r.type === 'bump') { v.bump = now; sfx.bump(); buzz(8); return; }
    const T = tok, [dx, dy] = P.D[a.dir];
    const sx = v.x, sy = v.y;
    let tEnd;
    if (r.type === 'drink') {
      v.path = { sx, sy, ex: sx + dx * r.steps, ey: sy + dy * r.steps, t0: now, dur: 80 * r.steps + 120 };
      v.state = 'drinking'; tEnd = v.path.dur;
      const drank = L.animals.length - sim.left;
      setTimeout(() => { if (T !== tok) return; sfx.drink(drank % 8); fx.push({ t: 'splash', x: sx + dx * r.steps, y: sy + dy * r.steps, t0: performance.now() }); }, v.path.dur);
    } else {
      const ex = r.to % L.n, ey = (r.to / L.n) | 0;
      v.path = { sx, sy, ex, ey, t0: now, dur: 80 * r.steps + 60 }; tEnd = v.path.dur;
      setTimeout(sfx.step, 30);
      if (r.enemy >= 0) setTimeout(() => {
        if (T !== tok) return;
        sfx.scare(); buzz([20, 30, 20]);
        const preyId = a.pred ? r.enemy : id, pv = vis[preyId];
        fx.push({ t: 'bang', x: a.pred ? pv.x : ex, y: a.pred ? pv.y : ey, t0: performance.now() });
        vis[a.pred ? id : r.enemy].glare = performance.now();
      }, v.path.dur);
    }
    hud();
    if (sim.lost) {
      ended = true;
      const prey = a.pred ? L.animals[r.enemy] : a, pr = a.pred ? a : L.animals[r.enemy];
      setTimeout(() => { if (T !== tok) return; sfx.fail();
        $('failE').textContent = PREY[prey.sp]; $('failT').textContent = `The ${NAME_PREY[prey.sp]} is too scared!`;
        $('failP').textContent = `It ended up right next to the ${NAME_PRED[pr.sp]}. Never let prey stop beside a predator.`;
        $('failOv').classList.add('show'); }, tEnd + 700);
    } else if (sim.won) {
      ended = true;
      setTimeout(() => { if (T !== tok) return; sfx.win();
        $('winT').textContent = 'Everyone drank!'; $('winP').textContent = `${sim.taps} moves.`;
        $('winOv').classList.add('show'); }, tEnd + 500);
    }
  }
  $('hintB').onclick = () => {
    if (ended) return;
    const r = P.solve(L, sim, { budget: 80000 });
    if (r.ok) hint = { id: r.path[0], t0: performance.now() };
    else toast(r.ok === false ? 'Stuck: no way to finish from here. Restart.' : 'Too deep for a quick hint');
  };
  $('retryB').onclick = () => start(L.id);
  $('nextB').onclick = () => start(L.id + 1);
  $('failB').onclick = () => start(L.id);
  $('menuB').onclick = () => {
    const l = $('lvList'); l.innerHTML = '';
    for (const lv of LEVELS) { const d = document.createElement('div'); d.className = 'row'; const np = lv.animals.filter((a) => a.pred).length;
      d.innerHTML = `<b>${lv.id}</b><span>${lv.n}×${lv.n} · ${lv.animals.length} animals · ${np} predators</span><span>${lv.stats.gated} gated · ${lv.stats.minSlides} stop${lv.stats.minSlides > 1 ? 's' : ''} needed</span>`;
      d.onclick = () => { $('menuOv').classList.remove('show'); start(lv.id); }; l.appendChild(d); }
    $('menuOv').classList.add('show');
  };
  $('closeM').onclick = () => $('menuOv').classList.remove('show');
  let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function frame(now) {
    requestAnimationFrame(frame);
    if (!L || !G) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // water
    const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#3aa6cf'); gr.addColorStop(1, '#1f7aa3');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const y = (i * 67 + now / 40) % H, x = (i * 131) % W; ctx.beginPath(); ctx.arc(x, y, 14 + (i % 3) * 6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    const { cs, ox, oy } = G, n = L.n;
    // shore + meadow
    ctx.fillStyle = '#e8d49a'; rr(ox - 14, oy - 14, cs * n + 28, cs * n + 28, 22); ctx.fill();
    ctx.fillStyle = '#7cc46a'; rr(ox - 4, oy - 4, cs * n + 8, cs * n + 8, 16); ctx.fill();
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if ((x + y) % 2) { ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(ox + x * cs, oy + y * cs, cs, cs); } }
    ctx.font = `${Math.round(cs * 0.62)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const r of L.rocks) { const [cx, cy] = cellXY(r % n, (r / n) | 0); ctx.fillText('🪨', cx, cy + 2); }
    // animals
    for (let i = 0; i < L.animals.length; i++) {
      const a = L.animals[i], v = vis[i];
      if (v.state === 'gone') continue;
      let x = v.x, y = v.y, alpha = 1, hop = 0;
      if (v.path) {
        const p = Math.max(0, Math.min(1, (now - v.path.t0) / v.path.dur));
        x = v.path.sx + (v.path.ex - v.path.sx) * p; y = v.path.sy + (v.path.ey - v.path.sy) * p;
        hop = Math.abs(Math.sin(p * Math.PI * Math.max(1, Math.abs(v.path.ex - v.path.sx) + Math.abs(v.path.ey - v.path.sy)))) * cs * 0.12;
        if (v.state === 'drinking' && p >= 1) { alpha = Math.max(0, 1 - (now - v.path.t0 - v.path.dur) / 400); if (alpha <= 0) v.state = 'gone'; }
        if (v.state === 'fleeing') { alpha = 1 - p; if (p >= 1) v.state = 'gone'; }
        if (p >= 1 && v.state === 'here') { v.x = v.path.ex; v.y = v.path.ey; v.path = null; }
      }
      if (v.bump) { const p = (now - v.bump) / 220; if (p < 1) { const [dx, dy] = P.D[a.dir]; const k = Math.sin(p * Math.PI) * 0.18; x += dx * k; y += dy * k; } else v.bump = 0; }
      const [cx, cy0] = cellXY(x, y), cy = cy0 - hop;
      ctx.save(); ctx.globalAlpha = alpha;
      // base disc: warm for predators, cool for prey
      const gl = a.pred && v.glare && now - v.glare < 1200 ? 0.35 * (0.5 + 0.5 * Math.sin((now - v.glare) / 70)) : 0;
      ctx.fillStyle = a.pred ? `rgba(214,72,52,${0.32 + gl})` : 'rgba(255,255,255,.4)';
      ctx.beginPath(); ctx.ellipse(cx, cy0 + cs * 0.26, cs * 0.36, cs * 0.12, 0, 0, 6.283); ctx.fill();
      // arrow
      const ang = ANG[a.dir];
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(cs * 0.47, 0); ctx.lineTo(cs * 0.33, -cs * 0.12); ctx.lineTo(cs * 0.33, cs * 0.12); ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(20,40,30,.7)'; ctx.stroke();
      ctx.restore();
      const flip = a.dir === 'E' ? -1 : 1; // emoji face left by default
      ctx.save(); ctx.translate(cx, cy); ctx.scale(flip, 1);
      ctx.font = `${Math.round(cs * 0.6)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      ctx.fillText(a.pred ? PRED[a.sp] : PREY[a.sp], 0, 2);
      ctx.restore();
      ctx.restore();
    }
    // effects
    fx = fx.filter((f) => now - f.t0 < 700);
    for (const f of fx) {
      const p = (now - f.t0) / 700, [cx, cy] = cellXY(f.x, f.y);
      if (f.t === 'splash') { ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, cs * (0.2 + p * 0.6), 0, 6.283); ctx.stroke(); ctx.font = `${Math.round(cs * 0.4)}px sans-serif`; ctx.fillText('💧', cx, cy - cs * 0.5 * p); }
      if (f.t === 'danger') { ctx.strokeStyle = `rgba(230,40,30,${1 - p})`; ctx.lineWidth = 4; ctx.strokeRect(ox + f.x * cs + 3, oy + f.y * cs + 3, cs - 6, cs - 6); }
      if (f.t === 'bang') { ctx.font = `900 ${Math.round(cs * 0.55)}px system-ui,sans-serif`; ctx.fillStyle = `rgba(255,220,40,${1 - p})`; ctx.strokeStyle = `rgba(80,20,0,${1 - p})`; ctx.lineWidth = 4; ctx.strokeText('!', cx, cy - cs * (0.5 + p * 0.3)); ctx.fillText('!', cx, cy - cs * (0.5 + p * 0.3)); }
    }
    if (hint && sim.pos[hint.id] >= 0) {
      const v = vis[hint.id], [cx, cy] = cellXY(v.x, v.y), p = ((now - hint.t0) % 1000) / 1000;
      ctx.strokeStyle = `rgba(255,214,50,${1 - p})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, cs * (0.45 + p * 0.4), 0, 6.283); ctx.stroke();
    }
  }
  window.__pond = { get sim() { return sim; }, get L() { return L; }, start, cellXY: (x, y) => cellXY(x, y) };
  layout(); start(save.level || 1); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
